<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班级学生管理系统</title>
  <!-- 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --secondary: #64748b;
      --secondary-hover: #475569;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      padding: 24px 16px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-card {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)) auto;
      gap: 12px;
      margin-bottom: 24px;
      background: #f1f5f9;
      padding: 16px;
      border-radius: 8px;
    }

    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    button {
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: var(--primary);
      color: white;
      transition: background-color 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button:hover { background-color: var(--primary-hover); }
    button:active { transform: scale(0.98); }

    button.btn-danger { background-color: var(--danger); }
    button.btn-danger:hover { background-color: var(--danger-hover); }

    button.btn-secondary { background-color: var(--secondary); }
    button.btn-secondary:hover { background-color: var(--secondary-hover); }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #f8fafc;
      font-weight: 600;
      color: #475569;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .action-btns button {
      padding: 4px 10px;
      font-size: 0.85rem;
    }

    .edit-input {
      padding: 4px 8px;
    }

    .empty-tip {
      text-align: center;
      color: var(--secondary);
      padding: 24px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎓 班级学生管理系统</h1>

    <!-- 1. 新增学生输入区域 -->
    <div class="form-card">
      <input type="text" id="student_id" placeholder="学号 (如: 2026001)">
      <input type="text" id="name" placeholder="姓名">
      <input type="number" id="score" placeholder="成绩 (0-100)">
      <button onclick="addStudent()">添加学生</button>
    </div>

    <!-- 2. 学生列表表格 -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>学号</th>
            <th>姓名</th>
            <th>成绩</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="student-table-body">
          <!-- 动态数据加载区 -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // ⚠️ 请在此处填入你自己的 Supabase 项目配置
    const SUPABASE_URL = 'https://your-project.supabase.co';
    const SUPABASE_ANON_KEY = 'your-anon-key';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 当前正在编辑的学生 ID（null 表示没有正在编辑的行）
    let editingId = null;

    // 页面完全加载后调用数据 fetch
    window.onload = fetchStudents;

    // 从 Supabase 查询学生列表并渲染
    async function fetchStudents() {
      const { data, error } = await supabase
        .from('students')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        alert('读取数据失败，请检查配置: ' + error.message);
        return;
      }

      const tbody = document.getElementById('student-table-body');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-tip">暂无学生数据，请在上方添加！</td></tr>';
        return;
      }

      data.forEach(student => {
        const tr = document.createElement('tr');

        // 如果是当前正在编辑的行
        if (editingId === student.id) {
          tr.innerHTML = `
            <td><input class="edit-input" id="edit-studentid-${student.id}" value="${student.student_id}"></td>
            <td><input class="edit-input" id="edit-name-${student.id}" value="${student.name}"></td>
            <td><input class="edit-input" id="edit-score-${student.id}" type="number" value="${student.score}"></td>
            <td class="action-btns">
              <button onclick="saveEdit(${student.id})">保存</button>
              <button class="btn-secondary" onclick="cancelEdit()">取消</button>
            </td>
          `;
        } else {
          // 普通展示行
          tr.innerHTML = `
            <td>${student.student_id}</td>
            <td>${student.name}</td>
            <td>${student.score ?? 0}</td>
            <td class="action-btns">
              <button class="btn-secondary" onclick="startEdit(${student.id})">编辑</button>
              <button class="btn-danger" onclick="deleteStudent(${student.id})">删除</button>
            </td>
          `;
        }
        tbody.appendChild(tr);
      });
    }

    // 新增学生
    async function addStudent() {
      const student_id = document.getElementById('student_id').value.trim();
      const name = document.getElementById('name').value.trim();
      const score = document.getElementById('score').value.trim();

      if (!student_id || !name) {
        alert('请填写完整的学号和姓名！');
        return;
      }

      const { error } = await supabase
        .from('students')
        .insert([{ 
          student_id: student_id, 
          name: name, 
          score: score ? Number(score) : 0 
        }]);

      if (error) {
        alert('添加失败: ' + error.message);
      } else {
        // 清空输入框
        document.getElementById('student_id').value = '';
        document.getElementById('name').value = '';
        document.getElementById('score').value = '';
        fetchStudents(); // 重新加载数据
      }
    }

    // 开启编辑模式
    function startEdit(id) {
      editingId = id;
      fetchStudents();
    }

    // 取消编辑
    function cancelEdit() {
      editingId = null;
      fetchStudents();
    }

    // 保存修改
    async function saveEdit(id) {
      const student_id = document.getElementById(`edit-studentid-${id}`).value.trim();
      const name = document.getElementById(`edit-name-${id}`).value.trim();
      const score = document.getElementById(`edit-score-${id}`).value.trim();

      const { error } = await supabase
        .from('students')
        .update({ 
          student_id: student_id, 
          name: name, 
          score: Number(score) 
        })
        .eq('id', id);

      if (error) {
        alert('更新失败: ' + error.message);
      } else {
        editingId = null;
        fetchStudents();
      }
    }

    // 删除学生
    async function deleteStudent(id) {
      if (!confirm('确定要删除这个学生的信息吗？')) return;

      const { error } = await supabase
        .from('students')
        .delete()
        .eq('id', id);

      if (error) {
        alert('删除失败: ' + error.message);
      } else {
        fetchStudents();
      }
    }
  </script>
</body>
</html>
