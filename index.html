<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课堂积分加分系统</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --danger: #ef4444;
      --secondary: #64748b;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    
    h1 { font-size: 1.5rem; margin-bottom: 20px; text-align: center; }
    
    .form-card { display: flex; gap: 10px; margin-bottom: 20px; background: #f1f5f9; padding: 15px; border-radius: 8px; flex-wrap: wrap; }
    input { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; flex: 1; min-width: 120px; }
    
    button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; background: var(--primary); color: white; font-weight: 500; }
    button.btn-danger { background: var(--danger); }
    button.btn-secondary { background: var(--secondary); }
    
    .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid var(--border-color); }
    th { background: #f8fafc; }
    
    .score-badge { font-weight: bold; font-size: 1.1rem; }
    .score-positive { color: #16a34a; }
    .score-negative { color: #dc2626; }
    
    .btn-group { display: flex; gap: 4px; flex-wrap: wrap; }
    .btn-sm { padding: 4px 8px; font-size: 0.8rem; }
    .btn-add { background: #16a34a; }
    .btn-sub { background: #dc2626; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏆 课堂积分加分系统</h1>

    <!-- 1. 添加学生（初始积分默认 0） -->
    <div class="form-card">
      <input type="text" id="student_id" placeholder="学号 (如: 01)">
      <input type="text" id="name" placeholder="学生姓名">
      <button onclick="addStudent()">添加学生</button>
    </div>

    <!-- 2. 排序控制栏 -->
    <div class="filter-bar">
      <div>
        <strong>排序方式：</strong>
        <button class="btn-secondary btn-sm" onclick="changeSort('student_id')">按学号排序</button>
        <button class="btn-secondary btn-sm" onclick="changeSort('score')">按积分排序</button>
      </div>
    </div>

    <!-- 3. 学生积分列表 -->
    <table>
      <thead>
        <tr>
          <th>学号</th>
          <th>姓名</th>
          <th>当前积分</th>
          <th>快捷扣分 / 加分</th>
          <th>自定义增减</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="student-table-body"></tbody>
    </table>
  </div>

  <script>
    // ⚠️ 请填入你的 Supabase 配置
    const SUPABASE_URL = 'https://kcuvmcuseqyjzltusyuc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjdXZtY3VzZXF5anpsdHVzeXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTg2MTUsImV4cCI6MjEwNDA5NDYxNX0.MxDUG8DFquygFOZr1QE8n7o3rCTj9K4Ev5-3qdboSD0';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentSortField = 'student_id'; // 默认按学号排序
    let isAscending = true;             // 排序方向

    window.onload = fetchStudents;

    // 切换排序方式
    function changeSort(field) {
      if (currentSortField === field) {
        isAscending = !isAscending; // 再次点击切换升序/降序
      } else {
        currentSortField = field;
        isAscending = field === 'student_id'; // 学号默认升序，积分默认降序
      }
      fetchStudents();
    }

    // 获取数据并渲染
    async function fetchStudents() {
      const { data, error } = await supabase
        .from('students')
        .select('*')
        .order(currentSortField, { ascending: isAscending });

      if (error) return alert('读取数据失败: ' + error.message);

      const tbody = document.getElementById('student-table-body');
      tbody.innerHTML = '';

      data.forEach(student => {
        const score = student.score ?? 0;
        const scoreClass = score >= 0 ? 'score-positive' : 'score-negative';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${student.student_id}</td>
          <td><strong>${student.name}</strong></td>
          <td><span class="score-badge ${scoreClass}">${score} 分</span></td>
          <td>
            <div class="btn-group">
              <button class="btn-sm btn-add" onclick="updateScore(${student.id}, ${score}, 5)">听课 +5</button>
              <button class="btn-sm btn-add" onclick="updateScore(${student.id}, ${score}, 10)">举手 +10</button>
              <button class="btn-sm btn-add" onclick="updateScore(${student.id}, ${score}, 5)">作业 +5</button>
              <button class="btn-sm btn-add" onclick="updateScore(${student.id}, ${score}, 15)">优秀作业 +15</button>
              <button class="btn-sm btn-sub" onclick="updateScore(${student.id}, ${score}, -10)">扰乱 -10</button>
              <button class="btn-sm btn-sub" onclick="updateScore(${student.id}, ${score}, -10)">未写作业 -10</button>
              <button class="btn-sm btn-sub" onclick="updateScore(${student.id}, ${score}, -30)">打架 -30</button>
            </div>
          </td>
          <td>
            <div style="display:flex; gap:4px; max-width: 120px;">
              <input type="number" id="custom-${student.id}" placeholder="±分值" style="padding:2px 4px; font-size:0.8rem;">
              <button class="btn-sm" onclick="applyCustomScore(${student.id}, ${score})">确定</button>
            </div>
          </td>
          <td>
            <button class="btn-danger btn-sm" onclick="deleteStudent(${student.id})">删除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 新增学生 (默认积分 score = 0)
    async function addStudent() {
      const student_id = document.getElementById('student_id').value.trim();
      const name = document.getElementById('name').value.trim();

      if (!student_id || !name) return alert('请填入学号和姓名！');

      const { error } = await supabase
        .from('students')
        .insert([{ student_id, name, score: 0 }]);

      if (error) {
        alert('添加失败: ' + error.message);
      } else {
        document.getElementById('student_id').value = '';
        document.getElementById('name').value = '';
        fetchStudents();
      }
    }

    // 更新积分（支持加分和减分，允许负数）
    async function updateScore(id, currentScore, change) {
      const newScore = currentScore + change;
      const { error } = await supabase
        .from('students')
        .update({ score: newScore })
        .eq('id', id);

      if (error) alert('更新积分失败: ' + error.message);
      else fetchStudents();
    }

    // 自定义加减分
    async function applyCustomScore(id, currentScore) {
      const input = document.getElementById(`custom-${id}`);
      const change = Number(input.value);
      if (isNaN(change) || change === 0) return alert('请输入有效的分数增减值！');
      
      await updateScore(id, currentScore, change);
    }

    // 删除学生
    async function deleteStudent(id) {
      if (!confirm('确定删除该学生吗？')) return;
      const { error } = await supabase.from('students').delete().eq('id', id);
      if (error) alert('删除失败: ' + error.message);
      else fetchStudents();
    }
  </script>
</body>
</html>
